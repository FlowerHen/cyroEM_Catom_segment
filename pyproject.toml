[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cryo-calpha"
version = "0.1.0"
description = "Reproducible C-alpha heatmap detection for cryo-EM density maps"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "biopython>=1.83",
  "mrcfile>=1.5",
  "numpy>=1.26",
  "PyYAML>=6.0",
  "scipy>=1.12",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
cryo-calpha = "cryo_calpha.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cryo_calpha"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
