data:
  root_dir: ../data/raw
  manifest_path: ../data/manifest.jsonl
  cache_dir: ../data/cache-v1
  crop_size_zyx: [64, 64, 64]
  overlap_fraction: 0.25
  heatmap_sigma_angstrom: 1.5
  heatmap_truncate_sigma: 3.0
  empty_to_positive_ratio: 0.5
  split_ratios:
    train: 0.8
    val: 0.1
    test: 0.1
  seed: 42

augmentation:
  enabled: true
  rotation_probability: 0.5
  gaussian_noise_probability: 0.3
  gaussian_noise_std: 0.05
  gaussian_blur_probability: 0.2
  gaussian_blur_sigma_voxels: [0.5, 1.0]

model:
  base_channels: 16
  depth: 4
  dropout: 0.1

training:
  output_dir: ../runs/baseline
  device: auto
  epochs: 100
  batch_size: 2
  num_workers: 4
  learning_rate: 0.0003
  weight_decay: 0.00001
  accumulation_steps: 1
  gradient_clip_norm: 1.0
  amp: true
  pos_weight: 50.0
  bce_weight: 1.0
  focal_weight: 0.5
  dice_weight: 0.5
  focal_alpha: 0.75
  focal_gamma: 2.0
  early_stopping_patience: 10
  seed: 42

inference:
  overlap_fraction: 0.5
  window_batch_size: 2
  probability_threshold: 0.35
  nms_radius_angstrom: 2.0
  match_radius_angstrom: 2.0
